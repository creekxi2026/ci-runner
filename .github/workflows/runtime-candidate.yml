name: Runtime candidate verification
on:
  pull_request:
    paths:
      - Dockerfile
      - runner.sh
      - retired_inputs_test.go
      - tests/test_retired_inputs.py
      - incremental_*.go
      - git_cache.go
      - git_cache_test.go
      - git-cache.py
      - tests/test_git_cache.py
      - controller.go
      - controller_recovery.go
      - workspace.go
      - workspace-init.py
      - shared_work_runtime_test.go
      - scripts/runtime_candidate.py
      - tests/test_runtime_candidate.py
      - compose.yaml
      - examples/cache/**
      - cache-compatibility.json
      - toolcache-init.sh
      - tests/test_toolcache.py
      - scripts/image_preflight.py
      - tests/test_image_preflight.py
      - .github/workflows/images.yml
      - .github/workflows/runtime-candidate.yml
permissions:
  contents: read
concurrency:
  group: runtime-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preflight-contract:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_image_preflight.py -v
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check public image inputs before tool setup and build
        timeout-minutes: 2
        run: python3 scripts/image_preflight.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify generic runtime contracts
        run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s tests
          python3 scripts/verify-setup-go-patch.py
          node scripts/check-cache-timer.cjs
          node scripts/check-setup-go-action.cjs
      - name: Verify controller Git cache runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          docker build --target controller --build-arg "SOURCE_REVISION=$SOURCE_REVISION" -t git-cache-controller:review .
          docker run --rm --read-only --network none --entrypoint python3 git-cache-controller:review /opt/ci/git-cache.py --help
          docker run --rm --read-only --network none --entrypoint git git-cache-controller:review --version
      - name: Select verified runner or build changed image inputs
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/runtime_candidate.py --source-revision "$SOURCE_REVISION"
          docker image inspect runtime-candidate:review --format '{{.Id}}'
      - name: Prove offline toolcache and private job lifecycle
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --mount type=volume,dst=/tmp \
            --entrypoint /bin/sh runtime-candidate:review -ec '
              /opt/ci/toolcache-init.sh /tmp/toolcache
              test "$(/tmp/toolcache/go/1.26.9/arm64/bin/go version)" = "go version go1.26.9 linux/arm64"
              test "$(/tmp/toolcache/node/24.14.0/arm64/bin/node --version)" = "v24.14.0"
              test -f /tmp/toolcache/go/1.26.9/arm64.complete
              test -f /tmp/toolcache/node/24.14.0/arm64.complete
              test "$(readlink /tmp/toolcache/go/1.26.9/arm64)" = /opt/go
              test ! -w /opt/go/bin/go
            '
          CI_DISK_INTEGRATION_IMAGE=runtime-candidate:review go test -run '^TestJobDiskRuntime$' -v
          bash scripts/check-shared-work-runtime.sh runtime-candidate:review
          bash scripts/check-service-runtime.sh runtime-candidate:review

      - name: Verify native Go cache reuse and source invalidation offline
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -c -o "$RUNNER_TEMP/native-cache-test"
          # Go executes its generated test binary under TMPDIR; Docker tmpfs
          # defaults to noexec. This applies only to the isolated test container.
          docker run --rm --network none --read-only --user 0 \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --security-opt no-new-privileges --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m \
            --mount "type=bind,src=$RUNNER_TEMP/native-cache-test,dst=/test,readonly" \
            -e HOME=/tmp -e TMPDIR=/tmp -e CI_NATIVE_CACHE_TEST=1 \
            --entrypoint /test runtime-candidate:review \
            -test.run '^TestIncremental' -test.v -test.timeout=180s
