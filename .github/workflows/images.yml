name: Cloud ARM64 images
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
          cache: false
      - run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s tests -v
          python3 scripts/verify-setup-go-patch.py
          node scripts/check-cache-timer.cjs
      - name: Publish candidate images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker buildx create --driver docker-container --use
          for target in controller runner postgres; do
            docker buildx build --platform linux/arm64 --provenance=false --target "$target" \
              --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --output "type=image,name=ghcr.io/$GITHUB_REPOSITORY-$target,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "deployment/$target.json" .
          done
          # Prove the application toolchain is present without any network access
          # before promoting this release for deployment.
          runner_ref="$(python3 -c 'import json; m=json.load(open("deployment/runner.json")); print(m["image.name"]+"@"+m["containerimage.digest"])')"
          docker pull "$runner_ref"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --mount type=volume,dst=/tmp \
            --entrypoint /bin/sh "$runner_ref" -ec '
              /opt/ci/toolcache-init.sh /tmp/toolcache
              test "$(/tmp/toolcache/go/1.26.6/arm64/bin/go version)" = "go version go1.26.6 linux/arm64"
              test "$(/tmp/toolcache/node/24.14.0/arm64/bin/node --version)" = "v24.14.0"
              test -f /tmp/toolcache/go/1.26.6/arm64.complete
              test -f /tmp/toolcache/node/24.14.0/arm64.complete
              test "$(readlink /tmp/toolcache/go/1.26.6/arm64)" = /opt/go
              test "$(readlink /tmp/toolcache/node/24.14.0/arm64)" = /usr/local
              test ! -w /opt/go/bin/go
              test ! -w /usr/local/bin/node
            '
          # Exercise the new image through the real controller's disk provisioner.
          postgres_ref="$(python3 -c 'import json; m=json.load(open("deployment/postgres.json")); print(m["image.name"]+"@"+m["containerimage.digest"])')"
          docker pull "$postgres_ref"
          CI_DISK_INTEGRATION_IMAGE="$runner_ref" CI_DISK_INTEGRATION_POSTGRES="$postgres_ref" \
            go test -run '^TestJobDiskRuntime$' -v
          bash scripts/check-shared-work-runtime.sh "$runner_ref" "$postgres_ref"
          python3 scripts/promote_latest.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" deployment
          python3 scripts/release_env.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" deployment
          cp compose.yaml deployment/compose.yaml
      # Artifact creation selects the coherent deployment after all latest promotions.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: deployment-${{ github.sha }}
          path: deployment/
          if-no-files-found: error
          retention-days: 30
