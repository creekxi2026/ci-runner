name: Cloud ARM64 images
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.3'
          cache: false
      - run: |
          go test ./...
          python3 -m unittest discover -s tests -v
      - name: Publish both ARM64 targets
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in controller runner; do
            docker build --platform linux/arm64 --target "$target" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "ghcr.io/$GITHUB_REPOSITORY:$target" \
              -t "ghcr.io/$GITHUB_REPOSITORY:$target-$GITHUB_SHA" .
            docker push "ghcr.io/$GITHUB_REPOSITORY:$target"
            docker push "ghcr.io/$GITHUB_REPOSITORY:$target-$GITHUB_SHA"
          done
          docker logout ghcr.io
