name: Cloud ARM64 images
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.3'
          cache: false
      - run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s tests -v
      - name: Publish candidate images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for target in controller runner; do
            docker buildx build --platform linux/arm64 --provenance=false --target "$target" \
              --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --tag "ghcr.io/$GITHUB_REPOSITORY:$target-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --metadata-file "deployment/$target.json" --push .
          done
          python3 scripts/release_env.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" deployment
          cp compose.yaml deployment/compose.yaml
      # Artifact creation is the pair's publication boundary, not either image tag.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-${{ github.sha }}
          path: deployment/
          if-no-files-found: error
          retention-days: 30
