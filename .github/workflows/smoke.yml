name: Isolated ephemeral smoke
on:
  workflow_dispatch:
    inputs:
      fail_slot4:
        description: Exercise expected failed-job cleanup
        type: boolean
        default: false
      hold_seconds:
        description: Hold busy runners for recovery/cancellation verification (0-300)
        type: string
        default: '45'
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ci-mac-arm64-smoke
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./actions/setup-go
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.14.0'
      - name: Prove tools, public internet and service metadata
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          set -euo pipefail
          [[ "$HOLD_SECONDS" =~ ^[0-9]{1,3}$ ]] && (( 10#$HOLD_SECONDS <= 300 ))
          test "$(uname -m)" = aarch64
          test ! -e /var/run/docker.sock
          test "$(stat -f -c %T /home/runner)" != tmpfs
          test "$(stat -f -c %T /tmp)" != tmpfs
          ! command -v sudo
          git --version; node --version; npm --version; python3 --version
          go version; go env GOPROXY GOSUMDB; go test ./...
          python3 -m unittest discover -s tests -v
          python3 scripts/verify-setup-go-patch.py
          node scripts/check-cache-timer.cjs
          test -s /home/runner/.ci-workspace-ready
          test ! -e /templates
          # Public HTTPS reachability must not depend on anonymous API quotas.
          curl -fsS --max-time 30 https://github.com/robots.txt -o /dev/null
          test -r "$CI_SERVICES_FILE"
          test -n "$CI_SERVICES_FINGERPRINT"
          python3 scripts/network_probe.py
          printf 'RECOVERY_HOLD_START runner=%s\n' "$RUNNER_NAME"
          sleep "$HOLD_SECONDS"
      - name: Deliberate failed-job cleanup exercise
        if: inputs.fail_slot4 && matrix.slot == 4
        run: exit 17
