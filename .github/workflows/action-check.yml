name: Go action distribution
on:
  push:
    paths: ['actions/setup-go/**', 'scripts/check-setup-go-action.cjs', 'scripts/check-cache-timer.cjs', 'scripts/verify-setup-go-patch.py', '.github/workflows/action-check.yml']
  pull_request:
    paths: ['actions/setup-go/**', 'scripts/check-setup-go-action.cjs', 'scripts/check-cache-timer.cjs', 'scripts/verify-setup-go-patch.py', '.github/workflows/action-check.yml']
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify provenance and action command contract
        run: |
          python3 scripts/verify-setup-go-patch.py
          node scripts/check-cache-timer.cjs
          node scripts/check-setup-go-action.cjs
      - name: Consume the maintained action on a real GitHub runner
        uses: ./actions/setup-go
        with:
          go-version: '1.26.9'
          cache: false
