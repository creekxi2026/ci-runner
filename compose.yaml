name: ${COMPOSE_PROJECT_NAME:-ci-runner}
services:
  controller:
    image: ${CONTROLLER_IMAGE:?Set digest-pinned CONTROLLER_IMAGE from a successful deployment artifact}
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: ${RUNNER_MAX_LIFETIME_SECONDS:-3600}s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      GITHUB_CONFIG_URL: ${GITHUB_CONFIG_URL:?Set repository URL}
      SCALE_SET_NAME: ${SCALE_SET_NAME:-ci-mac-arm64-smoke}
      RUNNER_IMAGE: ${RUNNER_IMAGE:?Set digest-pinned RUNNER_IMAGE from the same deployment artifact}
      IMAGE_REVISION: ${IMAGE_REVISION:?Set source revision from the deployment artifact}
      POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Set a digest-pinned PostgreSQL image}
      RUNNER_IDLE_TIMEOUT_SECONDS: ${RUNNER_IDLE_TIMEOUT_SECONDS:-300}
      RUNNER_MAX_LIFETIME_SECONDS: ${RUNNER_MAX_LIFETIME_SECONDS:-3600}
      PUBLIC_EGRESS_UPSTREAM_PROXY: ${PUBLIC_EGRESS_UPSTREAM_PROXY:-}
      HTTP_PROXY: ${PUBLIC_EGRESS_UPSTREAM_PROXY:-}
      HTTPS_PROXY: ${PUBLIC_EGRESS_UPSTREAM_PROXY:-}
      EGRESS_NETWORK: ${COMPOSE_PROJECT_NAME:-ci-runner}_egress
      DEPLOYMENT_ID: ${COMPOSE_PROJECT_NAME:-ci-runner}
    secrets: [github_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [egress]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  egress: {}
secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-./.secrets/github-token}
